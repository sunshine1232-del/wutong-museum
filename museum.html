<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wutong Museum</title>
<style>
  html,body{height:100%;margin:0;background:#f3e8d6;color:#2b2117;font-family:"Segoe UI","Microsoft YaHei",sans-serif}
  #load{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:#f3e8d6;text-align:center}
  #load h1{font-family:Georgia,serif;font-size:clamp(28px,4vw,46px);letter-spacing:.28em;margin:0 0 10px;text-indent:.28em}
  #load p{font-size:11px;letter-spacing:.14em;color:#8a7860;margin:0 0 28px}
  #bar{width:min(420px,72vw);height:2px;background:rgba(60,45,30,.16);margin:0 auto;overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:#9a4f2b;transition:width .2s}
  #pct{font:10px/1.6 Consolas,monospace;letter-spacing:.12em;color:#8a7860;margin-top:10px}
  #err{display:none;max-width:520px;padding:0 20px;font-size:12px;line-height:1.9;color:#8d2f23}
</style>
</head>
<body>
<div id="load">
  <div>
    <h1>WUTONG HALL</h1>
    <p>Loading the 3D exhibition in 20 parts</p>
    <div id="bar"><i></i></div>
    <div id="pct">0%</div>
    <div id="err"></div>
  </div>
</div>
<script>
(function(){
  var N = 20;
  var VIDEO_URL = 'https://github.com/sunshine1232-del/wutong-museum/releases/download/v1/corridor-screen.mp4';
  var bar = document.querySelector('#bar i');
  var pct = document.getElementById('pct');
  var err = document.getElementById('err');
  var done = 0;
  var chunks = new Array(N);
  function fail(msg){ err.style.display='block'; err.textContent = msg; }
  function fetchOne(i){
    return fetch('hall.part' + String(i).padStart(2,'0'), {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('part '+i+' HTTP '+r.status); return r.arrayBuffer(); })
      .then(function(b){ chunks[i]=b; done++; var p=Math.round(done/N*100); bar.style.width=p+'%'; pct.textContent=p+'%'; });
  }
  var queue = [];
  for (var i=0;i<N;i++) queue.push(i);
  function next(){
    if (!queue.length) return Promise.resolve();
    var i = queue.shift();
    return fetchOne(i).then(next);
  }
  Promise.all([next(),next(),next(),next()]).then(function(){
    var total = chunks.reduce(function(a,b){ return a + b.byteLength; }, 0);
    var buf = new Uint8Array(total);
    var off = 0;
    chunks.forEach(function(c){ buf.set(new Uint8Array(c), off); off += c.byteLength; });
    var html = new TextDecoder('utf-8').decode(buf);
    if (VIDEO_URL) {
      html = html.replace("overlay.preload = 'auto';", "overlay.preload = 'metadata';");
      html = html.replace(
        "const videoURL = PARAMS.get('video') || 'assets/corridor-screen.mp4';",
        "const videoURL = " + JSON.stringify(VIDEO_URL) + ";"
      );
    }
    document.open();
    document.write(html);
    document.close();
  }).catch(function(e){
    fail('Failed to load the 3D exhibition: ' + e.message + '. Please hard-refresh and try again.');
  });
})();
</script>
</body>
</html>
